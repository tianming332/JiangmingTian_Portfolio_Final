<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f6f1"><title>画廊 | 天将明</title>
  <meta name="description" content="天将明作品集中的摄影、图形、AI 图像与视觉片段档案。">
  <link rel="stylesheet" href="css/gallery.css"><link rel="shortcut icon" href="img/favicon.png">
</head>
<body class="gallery-page">
  <header class="gallery-topbar">
    <a class="gallery-brand" data-site-key="main" href="index.html#all-works"><b>TJM</b><span>天将明<br><small>VISUAL × AI</small></span></a>
    <a class="gallery-back" data-site-key="main" href="index.html#all-works">所有作品 <small>ALL WORKS</small></a>
  </header>
  <main class="gallery-main">
    <section class="gallery-intro">
      <p class="eyebrow">画廊 / IMAGE ARCHIVE</p>
      <h1>随意看看，<br>停在喜欢的画面。</h1>
      <p>工作、生活、摄影与作品片段以图片并置。使用滚轮拉近或拉远，悬停选中，点击后可以拖动画面慢慢观看。</p>
    </section>
    <section class="gallery-stage-wrap" aria-label="作品画廊">
      <div class="gallery-stage" id="galleryStage" tabindex="0" aria-label="可缩放作品图片墙"></div>
      <div class="gallery-scale" aria-live="polite"><span id="galleryScale">100%</span><small>SCROLL TO ZOOM</small></div>
      <div class="gallery-filter" id="galleryFilters"><p>标签 / TAGS</p><div class="gallery-filter-list"></div></div>
    </section>
  </main>
  <footer class="gallery-footer"><span>© 天将明个人作品集</span><span>IMAGE ARCHIVE</span></footer>
  <section class="gallery-viewer" id="galleryViewer" aria-hidden="true" aria-label="图片放大查看">
    <div class="gallery-viewer-bar"><p id="viewerCaption"></p><button type="button" id="viewerClose">关闭 <small>CLOSE ×</small></button></div>
    <div class="gallery-viewer-canvas" id="viewerCanvas"><img id="viewerImage" alt="放大查看的画廊图片"></div>
    <p class="gallery-viewer-hint">左右拖动图片 / DRAG HORIZONTALLY</p>
  </section>
  <script src="data/site-links.js"></script><script src="data/gallery.js"></script><script src="js/gallery-2026.js"></script>
</body>
</html>
